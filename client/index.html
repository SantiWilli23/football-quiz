<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Futotal</title>
    <meta name="description" content="Trivia de fútbol para grupos de amigos: una tanda nueva cada día, puntos, rachas y ranking." />

    <!-- Para Google y para la vista previa al compartir el link (WhatsApp,
         Twitter/X, etc.) — sin esto el buscador y las apps de mensajería solo
         tienen el <title> y la <meta description> de arriba para mostrar. -->
    <link rel="canonical" href="https://football-quiz-nod2.onrender.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Futotal" />
    <meta property="og:title" content="Futotal — Trivia de fútbol para grupos de amigos" />
    <meta property="og:description" content="Trivia de fútbol para grupos de amigos: una tanda nueva cada día, puntos, rachas y ranking." />
    <meta property="og:url" content="https://football-quiz-nod2.onrender.com/" />
    <meta property="og:image" content="https://football-quiz-nod2.onrender.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Futotal — Trivia de fútbol para grupos de amigos" />
    <meta name="twitter:description" content="Trivia de fútbol para grupos de amigos: una tanda nueva cada día, puntos, rachas y ranking." />
    <meta name="twitter:image" content="https://football-quiz-nod2.onrender.com/icon-512.png" />

    <!-- Sin manifest, iOS no instala la app en la pantalla de inicio, y sin eso
         Apple no permite activar las notificaciones push. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e1317" />

    <!-- iOS ignora el manifest para el ícono y el modo pantalla completa:
         necesita sus propias etiquetas. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Futotal" />

    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Aplica el tema guardado ANTES del primer paint, para no arrancar en
         Nocturno (el default) y saltar al tema elegido un instante después. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("fq_theme");
          if (t === "azul" || t === "bengala" || t === "cancha-noche") document.documentElement.setAttribute("data-theme", t);
          var s = localStorage.getItem("fq_shape");
          if (s === "cancha") document.documentElement.setAttribute("data-shape", s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
