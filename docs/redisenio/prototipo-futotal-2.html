<title>Futotal 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: un estadio de bolsillo. Marcador de cancha (números condensados) como pieza central,
   césped oscuro como fondo, una sola pantalla de teléfono con todo lo importante en 5 pestañas.
   Se elige un único aspecto oscuro a propósito (es el de Futotal hoy). */
:root{
  --bg:#08100d; --bg2:#0d1713; --panel:#121e19; --panel2:#182720; --line:#23372e;
  --fg:#e9f2ed; --mute:#8ba69a; --dim:#5b766b;
  --acc:#2fb673; --acc2:#6fd9a8; --onacc:#04150c;
  --gold:#f2b84b; --red:#ef5b5b; --blue:#4aa8e8;
  --f-d:"Bricolage Grotesque",system-ui,sans-serif;
  --f-b:"Figtree",system-ui,sans-serif;
  --f-n:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-b);padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--fg)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.ic{display:block;flex:none}

/* barra de demostración */
.demo{max-width:1000px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
.demo .ttl{font-family:var(--f-d);font-weight:800;font-size:15px;margin-right:6px}
.demo .ttl span{color:var(--acc)}
.demo select,.demo button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--fg);font-size:12px}
.demo button:hover,.demo select:hover{border-color:var(--acc)}
.demo .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.demo .seg button{border:0;border-radius:0;background:none}
.demo .seg button.on{background:var(--acc);color:var(--onacc);font-weight:700}
.demo label{color:var(--mute)}

.wrap{max-width:1000px;margin:0 auto;display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.notes{width:min(100%,340px);display:flex;flex-direction:column;gap:10px}
.notes h2{font:800 13px var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mute)}
.note b{display:inline-block;font:700 11px var(--f-n);letter-spacing:.08em;background:var(--acc);color:var(--onacc);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.note strong{color:var(--fg)}

/* teléfono */
.phone{position:relative;width:min(100%,400px);height:min(800px,calc(100svh - 120px));min-height:640px;background:var(--bg2);border:1px solid var(--line);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -30px #000}
#top{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 16px}
.logo{font:800 20px var(--f-d);letter-spacing:-.02em}
.logo span{color:var(--acc)}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:700 15px var(--f-n);letter-spacing:.02em}
.pill .ic{color:var(--gold)}
.bellb{position:relative;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.bellb i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:4px}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--dim);font:600 11px var(--f-b);transition:color .2s}
#tabs button .ic{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#tabs button.on{color:var(--acc2)}
#tabs button.on .ic{transform:translateY(-2px) scale(1.12)}
#tabs button::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--acc);transform:translateX(-50%) scaleX(0);transition:transform .25s}
#tabs button.on::before{transform:translateX(-50%) scaleX(1)}
#tabs .bd{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/17px var(--f-n);text-align:center;padding:0 4px}
.phone.bare #top,.phone.bare #tabs{display:none}

/* capas */
#full,#sheetw,#fx,#ghost,#toast,#pushb{position:absolute;inset:0}
#full{z-index:30;background:var(--bg2);display:none;flex-direction:column;overflow:hidden}
#full.on{display:flex;animation:fadein .25s}
#sheetw{z-index:40;pointer-events:none}
#sheetw .scrim{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:auto;animation:fadein .25s forwards}
#sheetw .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 18px 24px;pointer-events:auto;animation:sheetin .35s cubic-bezier(.2,.9,.2,1) both;scrollbar-width:none}
#sheetw .sheet.out{animation:sheetout .22s forwards}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#fx{z-index:60;pointer-events:none;width:100%;height:100%}
#ghost{z-index:55;pointer-events:none}
#toast{z-index:70;pointer-events:none;display:flex;justify-content:center;align-items:flex-end;padding-bottom:84px}
.toast{background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;padding:9px 15px;border-radius:999px;animation:toast 2.6s both;max-width:90%;text-align:center}
#pushb{z-index:80;pointer-events:none;bottom:auto}
.push{margin:10px;background:#1c2d26f2;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:11px 14px;display:flex;gap:11px;align-items:center;pointer-events:auto;animation:pushin 4.6s both;cursor:pointer}
.push b{display:block;font-size:13px}.push span{font-size:12px;color:var(--mute)}
.push .app{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:800 11px var(--f-d)}

/* piezas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;background:var(--acc);color:var(--onacc);font:700 15px var(--f-b);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.big{min-height:58px;font:800 19px var(--f-d);border-radius:18px;width:100%;letter-spacing:.01em}
.btn.gold{background:var(--gold)}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
.link{color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 11px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--f-n);font-weight:700;letter-spacing:.06em;font-size:14px;color:var(--fg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.sect{margin-top:18px}
.sect>h3{font:800 16px var(--f-d);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sect>h3 button{font:600 12px var(--f-b);color:var(--acc2)}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#06100b;font:800 14px var(--f-d);flex:none}
.stg{animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms)}
.seg2{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg2 button{flex:1;padding:8px 4px;border-radius:9px;font:600 13px var(--f-b);color:var(--mute);transition:.2s}
.seg2 button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}

/* hero marcador */
.hero{margin-top:6px;border-radius:24px;padding:16px;border:1px solid var(--line);background:
  repeating-linear-gradient(90deg,#0f2118 0 38px,#112a1e 38px 76px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0,#2fb67322,transparent 60%);pointer-events:none}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;position:relative;z-index:1}
.cell{background:#050b08;border:1px solid #2a4237;border-radius:12px;padding:8px 6px 6px;text-align:center}
.cell .lab{display:block;font:700 11px var(--f-n);letter-spacing:.18em;color:var(--mute)}
.cell .num{display:block;font:700 44px/1 var(--f-n);color:var(--gold);text-shadow:0 0 14px #f2b84b55;font-variant-numeric:tabular-nums}
.cell .num.empty{color:#3a4f45;text-shadow:none}
.cell small{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.total{display:flex;align-items:baseline;justify-content:center;gap:8px;position:relative;z-index:1}
.total b{font:700 64px/1 var(--f-n);color:var(--fg);font-variant-numeric:tabular-nums}
.total span{font:700 13px var(--f-b);color:var(--mute);letter-spacing:.1em}
.x2{background:var(--gold);color:#241800;font:800 13px var(--f-n);letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.pulse{animation:pulse 1.8s infinite}
.week{display:flex;justify-content:space-between;align-items:center;margin-top:14px;position:relative;z-index:1}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font:700 10px var(--f-b);color:var(--dim);letter-spacing:.06em}
.wd i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--onacc)}
.wd.done i{background:var(--acc);border-color:var(--acc)}
.wd.sh i{background:var(--blue);border-color:var(--blue)}
.wd.now i{border-color:var(--gold);animation:pulse 1.8s infinite}
.wd.now.done i{background:var(--gold)}

/* tablas */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.row.me{background:#16342a;border-color:#2c6a4f}
.row .pos{width:20px;text-align:center;font:700 17px var(--f-n);color:var(--mute)}
.row .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pt{font:700 22px var(--f-n);font-variant-numeric:tabular-nums}
.row .dl{font:700 12px var(--f-n);width:34px;text-align:right}
.up{color:var(--acc2)}.dn{color:var(--red)}
.pend{font-size:11px;color:var(--dim);border:1px dashed var(--line);border-radius:999px;padding:3px 9px}
.nudge{font-size:11px;color:var(--gold);border:1px solid #6b5420;border-radius:999px;padding:3px 9px;margin-left:4px}
.gap{margin-top:10px;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.gap b{color:var(--fg)}
.dim{opacity:.55}
.cut{height:0;border-top:1px dashed var(--red);margin:2px 0;position:relative}
.cut::after{content:"pasan 4";position:absolute;right:0;top:-8px;font:700 10px var(--f-n);letter-spacing:.1em;background:var(--bg2);padding:0 5px;color:var(--red)}

/* jugar */
.hrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.gc{flex:none;width:128px;min-height:128px;scroll-snap-align:start;text-align:left;border-radius:18px;padding:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.gc:hover{transform:translateY(-3px);border-color:var(--gc)}
.gc:active{transform:scale(.97)}
.gc .gi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 22%,transparent);color:var(--gc);margin-bottom:auto}
.gc b{font:800 15px/1.1 var(--f-d)}
.gc small{font-size:11px;color:var(--mute)}
.gc.big{width:78%;min-height:160px;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 28%,var(--panel)),var(--panel) 70%)}
.gc.big .gi{width:56px;height:56px;border-radius:17px}
.gc.big b{font-size:21px}
.gc .bdg{position:absolute;top:10px;right:10px;background:var(--gold);color:#241800;font:800 10px var(--f-n);letter-spacing:.08em;padding:2px 6px;border-radius:5px}
.cap{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:6px}
.cap b{font:700 20px var(--f-n);color:var(--gold)}
.cap i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);transition:width .6s}

/* sheets */
.sh-h{display:flex;gap:14px;align-items:center}
.sh-h .gi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 22%,transparent);color:var(--gc);flex:none}
.sh-h h3{font:800 21px var(--f-d)}
.sh-h p{font-size:13px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.tags span{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.tags span.t0{border:0;padding:0 2px;color:var(--dim)}
.gain{margin-top:12px;font-size:13px;background:var(--panel2);border-radius:12px;padding:10px 12px;color:var(--mute)}
.gain b{color:var(--gold)}

/* reels (demos animadas) */
.reel{position:relative;height:150px;border-radius:16px;margin-top:14px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.finger{position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #ffffff33,0 6px 14px #0008;opacity:.9;z-index:5}
.rl-f{left:0;top:0;animation:rlf 4s infinite}
@keyframes rlf{0%{transform:translate(var(--x0),var(--y0));opacity:0}15%{opacity:.95}45%{transform:translate(var(--x1),var(--y1)) scale(1)}55%{transform:translate(var(--x1),var(--y1)) scale(.78)}65%{transform:translate(var(--x1),var(--y1)) scale(1)}90%{opacity:.95}100%{transform:translate(var(--x1),var(--y1));opacity:0}}
.rv-opts{display:flex;gap:8px;position:absolute;bottom:14px;left:50%;transform:translateX(-50%)}
.rv-opts span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600}
.rv-opts span:first-child{animation:rlok 4s infinite}
@keyframes rlok{0%,52%{background:var(--panel);border-color:var(--line)}58%,100%{background:var(--acc);color:var(--onacc);border-color:var(--acc)}}
.rv-field{position:absolute;top:14px;left:20px;right:20px;height:62px;border-radius:12px;background:repeating-linear-gradient(90deg,#14301f 0 24px,#173a26 24px 48px)}
.rv-p{position:absolute;top:24px;width:14px;height:14px;border-radius:50%;background:#fff}
.rv-p.a{left:20%;animation:rvmove 4s infinite}.rv-p.b{left:44%;background:var(--red)}
@keyframes rvmove{0%,20%{transform:translateX(0)}40%,100%{transform:translateX(70px)}}
.rb-g{display:grid;grid-template-columns:repeat(3,38px);gap:6px}
.rb-g span{height:38px;border-radius:9px;background:var(--panel);border:1px solid var(--line);animation:rlcell 5s infinite;animation-delay:calc(var(--k)*.45s)}
@keyframes rlcell{0%,10%{background:var(--panel);border-color:var(--line)}20%,80%{background:var(--acc);border-color:var(--acc);transform:scale(1.05)}90%,100%{background:var(--panel);border-color:var(--line);transform:none}}
.rw{width:112px;height:112px;border-radius:50%;background:conic-gradient(#2fb673 0 72deg,#4aa8e8 0 144deg,#f2b84b 0 216deg,#ef5b5b 0 288deg,#8e7dff 0 360deg);animation:rlspin 4s cubic-bezier(.2,.8,.2,1) infinite;border:3px solid var(--bg)}
@keyframes rlspin{0%{transform:rotate(0)}70%,100%{transform:rotate(900deg)}}
.rw-pt{position:absolute;top:8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:14px solid #fff}
.rv-av{position:absolute;top:50%;margin-top:-20px}
.rd-pitch{position:absolute;inset:14px 40px;border:2px solid #2a4a38;border-radius:10px;background:repeating-linear-gradient(0deg,#14301f 0 20px,#173a26 20px 40px)}
.rd-ch{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold);animation:rldrop 4.5s infinite;animation-delay:calc(var(--k)*.55s);opacity:0}
@keyframes rldrop{0%{transform:translateY(-70px);opacity:0}12%{opacity:1}22%,85%{transform:translateY(0);opacity:1}100%{opacity:0}}
.rbars{display:flex;align-items:flex-end;gap:10px;height:90px}
.rbars i{width:26px;border-radius:6px 6px 0 0;background:var(--acc);animation:rlbar 4s infinite alternate ease-in-out;animation-delay:calc(var(--k)*.4s)}
@keyframes rlbar{0%{height:20px}100%{height:var(--h)}}
.rdot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--acc2);animation:rlmove 4s infinite alternate ease-in-out;animation-delay:calc(var(--k)*.3s)}
@keyframes rlmove{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
.rcard{position:absolute;width:110px;height:84px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.rcard.top{animation:rlswipe 3.6s infinite}
@keyframes rlswipe{0%,25%{transform:none}55%,100%{transform:translateX(160px) rotate(18deg);opacity:0}}
.rfill{width:80%;height:14px;border-radius:7px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.rfill i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));animation:rlfill 4s infinite}
@keyframes rlfill{0%{width:0}80%,100%{width:100%}}

/* pantalla de juego */
.gh{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.gh .x{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.gt{font:800 14px var(--f-d);letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px}
.pills span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font:700 13px var(--f-n);color:var(--dim);letter-spacing:.06em;min-width:44px;text-align:center}
.pills span.on{border-color:var(--acc);color:var(--fg)}
.pills span.dn2{color:var(--gold)}
.gb{flex:1;min-height:0;padding:6px 16px 20px;display:flex;flex-direction:column;overflow-y:auto;position:relative;scrollbar-width:none}
.qwrap{display:flex;flex-direction:column;flex:1;gap:14px}
.timer{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--acc);transform-origin:left;transition:background .3s}
.dotsq{display:flex;gap:6px;justify-content:center}
.dotsq i{width:26px;height:5px;border-radius:3px;background:var(--panel2)}
.dotsq i.ok{background:var(--acc)}.dotsq i.no{background:var(--red)}.dotsq i.cur{background:var(--fg)}
.stem{flex:none;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:130px;justify-content:center}
.q{font:800 22px/1.15 var(--f-d);text-wrap:balance}
.q.big{font-size:24px}
.clues{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.clue{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;transition:.3s}
.clue:not(.on){color:transparent;background:var(--panel);border-style:dashed;user-select:none;min-width:54px}
.clue:not(.on)::after{content:"?";color:var(--dim)}
.clue:not(.on){position:relative}
.clue:not(.on)::after{position:absolute;inset:0;display:grid;place-items:center}
.arr{width:8px;height:8px;border-top:2px solid var(--dim);border-right:2px solid var(--dim);transform:rotate(45deg);margin:0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:64px;border-radius:16px;background:var(--panel);border:2px solid var(--line);padding:8px 10px;font:700 15px/1.2 var(--f-b);text-align:center;transition:transform .12s,border-color .2s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt:active{transform:scale(.96)}
.opt small{font-size:11px;color:var(--mute);font-weight:500}
.opt .val{font:700 28px var(--f-n);color:var(--gold);min-height:30px}
.opt.pl{min-height:150px}
.opt.good{border-color:var(--acc);background:#16442f;animation:pop .35s}
.opt.bad{border-color:var(--red);background:#47201f;animation:shake .35s}
.opt.hint{border-color:var(--acc2);box-shadow:0 0 0 4px #6fd9a833}
.blurc{filter:blur(12px);transition:filter .12s linear}
.ban{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:var(--bg2);z-index:3;animation:fadein .2s}
.ban b{display:block;font:800 40px var(--f-d)}.ban span{color:var(--mute)}
.ban em{display:block;font:700 13px var(--f-n);letter-spacing:.3em;color:var(--acc2);font-style:normal;margin-bottom:6px}

/* penales */
.field{position:relative;flex:1;min-height:280px;background:repeating-linear-gradient(0deg,#0f2218 0 34px,#122a1c 34px 68px);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.goal{position:absolute;left:8%;right:8%;top:18px;height:110px;border:4px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,#ffffff10 0 5px,transparent 5px 10px)}
.sweet{position:absolute;top:0;bottom:0;width:22%;background:#2fb67333;border:1px dashed var(--acc2)}
.sweet.l{left:0}.sweet.r{right:0}
.sweet.hint{animation:pulse 1s infinite}
.keeper{position:absolute;bottom:0;left:50%;width:34px;height:60px;margin-left:-17px;border-radius:14px 14px 4px 4px;background:var(--gold);transition:left .35s cubic-bezier(.2,.8,.2,1),transform .35s}
.aim{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--red);box-shadow:0 0 10px var(--red)}
.ballp{position:absolute;left:50%;bottom:24px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd8d3);border:2px solid #222;transition:left .45s cubic-bezier(.2,.7,.3,1),bottom .45s cubic-bezier(.2,.7,.3,1),transform .45s}
.flash{position:absolute;inset:0;display:grid;place-items:center;font:800 44px var(--f-d);pointer-events:none;animation:flash .9s both}
.pk{margin-top:12px}

/* ghost */
.finger.g{transition:transform .9s cubic-bezier(.4,.1,.2,1);left:0;top:0}
.finger.g.tap{animation:tap .35s}
.gcap{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:800 18px var(--f-d);padding:8px 18px;border-radius:999px;white-space:nowrap;animation:rise .4s both;box-shadow:0 10px 30px #0008}
.gskip{position:absolute;right:14px;top:60px;pointer-events:auto;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.ripple{position:absolute;width:34px;height:34px;margin:0;border-radius:50%;border:3px solid #fff;animation:ripple .6s forwards}

/* portada */
.porta{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;position:relative;overflow:hidden;background:
  radial-gradient(90% 55% at 50% 100%,#2fb67333,transparent 70%),repeating-linear-gradient(90deg,#0b1a13 0 46px,#0d2017 46px 92px)}
.wm{font:800 54px/1 var(--f-d);letter-spacing:-.04em}
.wm span{color:var(--acc)}
.tagl{color:var(--mute);max-width:230px}
.ballw{position:relative;height:130px;width:80px;margin-bottom:6px}
.ball{position:absolute;left:12px;bottom:14px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bfc9c4);border:3px solid #111;animation:bounce 1.1s infinite cubic-bezier(.3,0,.3,1)}
.ball::after{content:"";position:absolute;inset:16px;background:#111;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.bsh{position:absolute;left:14px;bottom:0;width:52px;height:10px;border-radius:50%;background:#000a;animation:bsh 1.1s infinite cubic-bezier(.3,0,.3,1)}
.porta .btn{max-width:280px}
.field2{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.field2 label{font-size:12px;color:var(--mute)}
.field2 input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
.field2 input:focus{border-color:var(--acc);outline:0}
.err{color:var(--red);font-size:12px;min-height:16px}
.favg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:11px;font-weight:600;transition:.2s}
.fav.on{border-color:var(--acc);background:#16342a;transform:translateY(-3px)}
.page{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}

/* resultados */
.res{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.fly{position:absolute;z-index:50;font:700 30px var(--f-n);color:var(--gold);text-shadow:0 0 12px #f2b84b88;pointer-events:none}
.reward{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.reward .pk2{width:38px;height:50px;border-radius:7px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 16px -2px var(--c1)}
.reward p{font-size:13px;color:var(--mute)}.reward b{color:var(--fg);display:block;font-size:14px}

/* cartas */
.packs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pack{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(145deg,var(--c1),var(--c2));position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:12px;box-shadow:0 14px 30px -14px var(--c1);transition:transform .2s;text-align:left}
.pack:hover{transform:translateY(-4px) rotate(-1.5deg)}
.pack::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff40 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.4s infinite}
.pack b{font:800 20px var(--f-d);color:#fff;text-shadow:0 2px 6px #0006}
.pack small{color:#fffc;font-size:12px}
.c3{width:100%;aspect-ratio:3/4;perspective:700px;cursor:pointer}
.c3 .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.c3.flip .in{transform:rotateY(180deg)}
.c3 .f,.c3 .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.c3 .b{background:repeating-linear-gradient(45deg,#1c3a2d 0 8px,#17302a 8px 16px);border:2px solid var(--acc);display:grid;place-items:center;color:var(--acc)}
.c3 .f{transform:rotateY(180deg);padding:8px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;border:2px solid var(--rc);background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 55%,#10201a),#0c1511 80%)}
.c3 .f .r{font:700 30px/1 var(--f-n);color:#fff}
.c3 .f .p{font:700 10px var(--f-n);letter-spacing:.14em;color:#fffb}
.c3 .f .nm2{margin-top:auto;font:800 11.5px/1.1 var(--f-d);color:#fff}
.c3 .f .cl{font-size:9px;color:#fffa;margin-top:2px}
.c3.glow .f{box-shadow:0 0 22px 2px var(--rc)}
.c3.lock .f{filter:grayscale(1) brightness(.35)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 0}
.pitch{position:relative;aspect-ratio:3/4;border-radius:16px;background:repeating-linear-gradient(0deg,#0f2218 0 36px,#122a1c 36px 72px);border:2px solid #2a4a38}
.pitch .ln{position:absolute;left:0;right:0;top:50%;border-top:2px solid #2a4a38}
.slot{position:absolute;width:46px;margin:-23px 0 0 -23px;text-align:center;font-size:9px;font-weight:700;line-height:1.1}
.slot i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 2px;border-radius:50%;border:2px dashed var(--dim);font:700 14px var(--f-n);color:var(--dim)}
.slot.f i{border:2px solid var(--rc);background:var(--rc);color:#06100b}
.packstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;position:relative}
.bigpack{width:150px;height:200px;border-radius:16px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 30px 60px -20px var(--c1);position:relative;overflow:hidden;animation:float 2.4s infinite ease-in-out}
.bigpack::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff55 50%,transparent 70%);animation:shine 2.4s infinite}
.bigpack.tear{animation:tear .8s forwards}
.cfan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.cfan .c3{animation:deal .5s both;animation-delay:calc(var(--i)*90ms)}

/* club */
.chead{display:flex;align-items:center;gap:12px;margin-top:6px}
.chead h2{font:800 22px var(--f-d);line-height:1.05}
.chead small{color:var(--mute);font-size:12px}
.seal{display:inline-flex;align-items:center;gap:5px;font:800 12px var(--f-n);letter-spacing:.1em;padding:3px 8px;border-radius:6px}
.seal.t{background:var(--gold);color:#241800}.seal.c{background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.bracket{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.mt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.mt .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.mt .t b{margin-left:auto;font:700 18px var(--f-n)}
.mt .t.w{color:var(--acc2)}.mt .t.l{opacity:.5}
.mt .st{font:700 10px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mt.now{border-color:var(--gold)}
.fin{grid-column:1/-1;max-width:70%;margin:6px auto 0;width:100%}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.fi small{display:block;color:var(--dim);font-size:11px}
.rcts{display:flex;gap:6px;margin-top:6px}
.rct{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px;background:var(--panel2);transition:.2s}
.rct.on{border-color:var(--acc);background:#16342a;transform:scale(1.08)}
.poll button{position:relative;overflow:hidden;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:6px;display:flex;justify-content:space-between;font-weight:600}
.poll button i{position:absolute;left:0;top:0;bottom:0;background:#2fb67340;transition:width .7s cubic-bezier(.2,.9,.2,1);width:0}
.poll button span{position:relative}

/* ajustes */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.tg{position:relative;width:46px;height:27px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--mute);transition:.25s}
.tg.on{background:var(--acc);border-color:var(--acc)}.tg.on::after{left:21px;background:#fff}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:600;padding:12px 4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.tr .ic{opacity:.5}
.tr.on{color:var(--fg);border-color:#6b5420;background:#2a2210}.tr.on .ic{color:var(--gold);opacity:1}
.tr.new{animation:pop .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font:700 30px var(--f-n)}
.stats span{font-size:11px;color:var(--mute)}
.hist{display:flex;align-items:flex-end;gap:8px;height:90px;padding-top:6px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font:700 11px var(--f-n);color:var(--mute)}
.hist i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--acc);animation:grow .8s both}

/* story */
.story{flex:1;display:flex;flex-direction:column;padding:16px;gap:16px;position:relative}
.sbars{display:flex;gap:4px}
.sbars i{flex:1;height:3px;border-radius:2px;background:var(--panel2);overflow:hidden;position:relative}
.sbars i b{position:absolute;inset:0;background:var(--fg);transform:scaleX(0);transform-origin:left}
.sbars i.done b{transform:scaleX(1)}
.sbars i.cur b{animation:sfill 3.6s linear forwards}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;animation:rise .5s both}
.slide .big{font:800 64px/1 var(--f-d);letter-spacing:-.03em}
.slide .num{font:700 120px/.9 var(--f-n);color:var(--gold)}
.podium{display:flex;align-items:flex-end;gap:8px;height:180px}
.podium div{width:84px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px;font-weight:700;background:var(--panel2);animation:up 1s cubic-bezier(.2,.9,.2,1) both;transform-origin:bottom}
.wheelw{position:relative;width:200px;height:200px;margin:8px auto}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid var(--bg);background:conic-gradient(#2fb673 0 72deg,#4aa8e8 0 144deg,#f2b84b 0 216deg,#ef5b5b 0 288deg,#8e7dff 0 360deg);transition:transform 3.6s cubic-bezier(.12,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;font:800 11px var(--f-d);color:#06100b;white-space:nowrap}
.wp{position:absolute;top:-8px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:20px solid #fff;z-index:2}
.fr{display:flex;gap:10px;justify-content:center}
.frd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:12px;font-weight:600}
.frd.on{border-color:var(--acc)}
.frd small{font-size:10px;color:var(--dim)}
.frd small.on{color:var(--acc2)}
.modes{display:grid;gap:10px}
.mode{text-align:left;border-radius:18px;background:var(--panel);border:2px solid var(--line);padding:14px;transition:.2s}
.mode.on{border-color:var(--acc);background:#14301f}
.mode h4{font:800 18px var(--f-d);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.mode p{font-size:13px;color:var(--mute)}
.mode ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}
.coin{display:inline-block;animation:spinc 2s infinite linear}

/* cotrero */
.cot{display:flex;flex-direction:column;gap:14px;flex:1}
.cot-top{display:flex;align-items:center;gap:16px}
.ring{--p:58;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 0 30px -10px var(--gold)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg2)}
.ri{position:relative;text-align:center}.ri b{display:block;font:700 38px/1 var(--f-n)}.ri small{font:700 10px var(--f-n);letter-spacing:.16em;color:var(--mute)}
.cot-club{display:flex;align-items:center;gap:12px;min-width:0}.cot-club b{display:block;font:800 18px/1.1 var(--f-d)}.cot-club small{color:var(--mute);font-size:12px}
.tl{display:flex;gap:5px}.tl i{flex:1;height:6px;border-radius:3px;background:var(--panel2);transition:.4s}.tl i.on{background:var(--acc)}.tl i.cur{background:var(--gold);animation:pulse 1.6s infinite}
.swap{animation:rise .45s both}
.dopts{display:flex;flex-direction:column;gap:10px}
.dopt{text-align:left;border-radius:16px;background:var(--panel);border:2px solid var(--line);padding:13px 14px;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .35s,border-color .2s;width:100%}
.dopt b{display:block;font:800 17px var(--f-d)}.dopt small{color:var(--mute);font-size:13px}
.dopt:hover{border-color:var(--acc)}
.dopt.hint{border-color:var(--acc2);box-shadow:0 0 0 4px #6fd9a833}
.dopt.pick{border-color:var(--gold);transform:scale(1.04);background:#2a2210}
.dopt.out{opacity:.2;transform:scale(.94) translateY(8px)}
.outc{align-self:center;font:700 48px/1 var(--f-n);padding:6px 20px;border-radius:12px;animation:pop .5s both}
.outc.up{color:var(--acc2);background:#14301f}.outc.dn{color:var(--red);background:#3a1a1a}
.statr{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;animation:rise .45s both}
.statr b{font:700 30px var(--f-n)}
.fich{display:grid;place-items:center;gap:8px;text-align:center;animation:pop .6s both;padding:6px 0}
.curve{width:100%;height:90px}.curve polyline{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s .2s forwards}
.cal{display:grid;place-items:center;width:110px;height:110px;margin:0 auto;border-radius:20px;background:var(--panel);border:2px solid var(--gold);animation:cal .9s both;font:700 56px var(--f-n)}
/* 8a2 */
.dr-pitch{position:relative;flex:none;height:210px;border-radius:16px;background:repeating-linear-gradient(0deg,#0f2218 0 26px,#122a1c 26px 52px);border:2px solid #2a4a38;overflow:hidden}
.dr-pitch .ln{position:absolute;left:0;right:0;top:50%;border-top:2px solid #2a4a38}
.dp{position:absolute;width:48px;margin:-17px 0 0 -24px;text-align:center;font:700 9px/1.1 var(--f-b);white-space:nowrap}
.dp i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 1px;border-radius:50%;border:2px dashed var(--dim);font:700 12px var(--f-n);color:var(--dim);font-style:normal}
.dp.f i{border:2px solid var(--rc);background:var(--rc);color:#06100b;animation:pop .45s}
.dp.nw i{box-shadow:0 0 0 6px #fff3}
.reelbox{height:54px;flex:none;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font:800 22px var(--f-d);transition:transform .08s}
.pl-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pli{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 10px;text-align:left;font-weight:700;font-size:13px;transition:.2s;animation:rise .35s both;animation-delay:calc(var(--i)*40ms)}
.pli small{display:block;font-size:10px;color:var(--mute);font-weight:500}
.pli .rt{font:700 22px var(--f-n);margin-left:auto}
.pli.dis{opacity:.28;pointer-events:none}
.pli.hint{border-color:var(--acc2);box-shadow:0 0 0 4px #6fd9a833}
.pli:hover{border-color:var(--acc)}
.fmt{display:flex;align-items:center;gap:14px;text-align:left}
.fmt b{font:700 30px var(--f-n);letter-spacing:.04em;min-width:64px}
.fmtd{display:flex;flex-direction:column;gap:3px}
.fmtd span{display:flex;gap:4px;justify-content:center}.fmtd i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.sim{position:relative;height:150px;flex:none;border-radius:14px;background:repeating-linear-gradient(90deg,#0f2218 0 30px,#122a1c 30px 60px);border:2px solid #2a4a38;overflow:hidden}
.sim .mid{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #2a4a38}
.sd{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;transition:left .55s linear,top .55s linear}

let AC;
function tone(f,d,type,g,delay=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(AC.destination);const t=AC.currentTime+delay;o.start(t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d+.02)}catch(e){}}
function sfx(k){if(!state.sound)return;({tap:()=>tone(520,.05,'sine',.05),ok:()=>{tone(660,.1,'triangle',.07);tone(880,.14,'triangle',.07,.08)},bad:()=>tone(150,.2,'sawtooth',.05),pop:()=>tone(700,.08,'square',.03),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.07,i*.1)),whoosh:()=>tone(300,.3,'sine',.04)})[k]?.()}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;const w=$('#toast');w.innerHTML='';w.appendChild(t);setTimeout(()=>{if(t.parentNode===w)w.innerHTML=''},2700)}

function confetti(n=90){if(state.reduce||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('#fx'),pr=$('#phone').getBoundingClientRect();cv.width=pr.width;cv.height=pr.height;const x=cv.getContext('2d');const cols=['#2fb673','#f2b84b','#4aa8e8','#ef5b5b','#fff','#8e7dff'];const ps=Array.from({length:n},()=>({x:pr.width/2+(Math.random()-.5)*60,y:pr.height*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:rnd(cols)}));let f=0;(function step(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,cv.width,cv.height)})()}
function countUp(el,from,to,ms=900){return new Promise(res=>{const t0=performance.now();const d=state.reduce?1:ms;(function f(now){const k=Math.min(1,(now-t0)/d);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);else res()})(t0)})}
function flip(container,order){const rows=[...container.children];const first=new Map(rows.map(r=>[r.dataset.id,r.getBoundingClientRect().top]));order.forEach(id=>container.appendChild(rows.find(r=>r.dataset.id===id)));rows.forEach(r=>{const dy=first.get(r.dataset.id)-r.getBoundingClientRect().top;if(dy){r.style.transition='none';r.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{r.style.transition='transform .8s cubic-bezier(.2,.9,.2,1)';r.style.transform=''}))}})}

function people(){const c=state.club;if(!c)return[];if(c.id==='demo')return PPL;return c.members.map(id=>{const p=PPL.find(x=>x.id===id);return{...p,mes:0,sem:0,gen:0,hoy:(c.started&&id!=='me')?(c.sim&&c.sim[id]!=null?c.sim[id]:null):null}})}
function ptsOf(p,view){const m=mult(),me=p.id==='me';const raw=me?((state.played&&state.scored)?state.score:null):p.hoy;const daily=raw==null?null:raw*m;if(view==='hoy')return daily;const free=me&&scoring()?state.free:0;const base=view==='mes'?p.mes:view==='sem'?p.sem:p.gen;return base+(daily||0)+free}
function rank(view){const L=people().map(p=>({p,pts:ptsOf(p,view)}));const a=L.filter(x=>x.pts!=null).sort((x,y)=>y.pts-x.pts);a.forEach((x,i)=>x.rank=i+1);const b=L.filter(x=>x.pts==null);return [...a,...b]}
const av=(p,s=34)=>`<span class="av" style="--c:${p.c};width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px">${p.n[0]}</span>`;

function cupInfo(){const n=people().length;const kind=n>=8?'qf':n>=4?'sf':n>=2?'f':'none';const seeds=rank('sem').map(x=>x.p);const sc=(p,round)=>{const rd=round==='sf'?5:round==='f'?6:4;if(state.day<rd)return null;if(p.id==='me'&&state.day===rd){return state.played?state.score*mult():null}if(p.id==='me')return 78*mult();let h=0;for(const ch of p.id+round)h=(h*31+ch.charCodeAt(0))%37;return(54+h)*mult()};const mk=(a,b,round)=>{const sa=a?sc(a,round):null,sb=b?sc(b,round):null;const rd=round==='sf'?5:6;const done=state.day>rd;const w=done&&sa!=null&&sb!=null?(sa>=sb?a:b):null;return{a,b,sa,sb,w,round,now:state.day===rd,done}};let sf=null,fin=null;if(kind==='sf'){sf=[mk(seeds[0],seeds[3],'sf'),mk(seeds[1],seeds[2],'sf')];fin=mk(sf[0].w,sf[1].w,'f')}else if(kind==='f'){fin=mk(seeds[0],seeds[1],'f')}return{n,kind,seeds,sf,fin}}

function renderTop(){$('#top').innerHTML=`<span class="logo">FUTO<span>TAL</span></span><span class="grow"></span>${flameStreak()}<button class="bellb" data-act="bell" aria-label="Avisos">${ic('bell',18)}${state.unread?'<i></i>':''}</button>`}
function renderTabs(){const T=[['hoy','Hoy','home'],['jugar','Jugar','pad'],['club','Club','shield'],['cartas','Cartas','cards'],['yo','Yo','user']];$('#tabs').innerHTML=T.map(([k,l,i])=>`<button data-act="tab" data-v="${k}" class="${state.tab===k?'on':''}" ${state.tab===k?'aria-current="page"':''}>${ic(i,22)}${l}${k==='cartas'&&state.packs.length?`<span class="bd">${state.packs.length}</span>`:''}</button>`).join('')}
function renderNotes(k){const n=NOTES[k]||[];$('#notes').innerHTML=`<h2>Qué cambió en esta pantalla</h2>`+n.map(([c,t,d])=>`<div class="note"><b>${c}</b><strong>${t}.</strong> ${d}</div>`).join('')+`<div class="note">Los códigos (A, B, C…) son los del plan. Los datos de jugadores y valores son de ejemplo.</div>`}

function vHoy(){
  const m=mult(),pl=state.played,c=state.club,d=state.day;
  const cell=(l,sub,i)=>`<div class="cell"><span class="lab">${l}</span><b class="num ${pl?'':'empty'}">${pl?state.parts[i]*m:'–'}</b><small>${sub}</small></div>`;
  const wk=DAYS.map((x,i)=>{let cls='';if(i<d)cls=i===1?'sh':'done';else if(i===d)cls='now'+(pl?' done':'');return `<div class="wd ${cls}"><i>${(cls.includes('done')||cls==='sh')?ic('check',12):''}</i>${x}</div>`}).join('');
  const hero=`<section class="hero stg" style="--i:0"><div class="eyebrow"><span>Partido del día · nº 298</span><span class="mono" data-cd>--:--:--</span></div>
  <div class="board">${cell('1T','¿Quién es?',0)}${cell('2T','Más o menos',1)}${cell('PEN','Penales',2)}</div>
  ${pl?`<div class="total"><b>${state.score*m}</b><span>PUNTOS${m>1?' <em class="x2">×2</em>':''}</span></div><div class="btns"><button class="btn ghost" data-act="share">${ic('share',18)}Compartir</button><button class="btn ghost" data-act="tab" data-v="club">Ver tabla</button></div>`
  :`<button class="btn big pulse" data-act="daily" style="position:relative;z-index:1">JUGAR</button><p style="text-align:center;margin-top:10px;font-size:12px;color:var(--mute);position:relative;z-index:1">3 minijuegos · unos 3 minutos${m>1?' · vale doble en tu club':''}</p>`}
  <div class="week">${wk}</div>
  <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--mute);position:relative;z-index:1"><span style="display:flex;gap:5px;align-items:center;color:var(--gold)">${ic('flame',14)}<b style="font:700 15px var(--f-n)">Racha de ${state.streak}</b></span><span style="display:flex;gap:5px;align-items:center;color:var(--blue)">${ic('shield',14)}Protector ×${state.shield}</span></div></section>`;
  let clubB;
  if(c&&!c.started)clubB=`<section class="sect stg" style="--i:1"><h3>${c.name}<button data-act="tab" data-v="club">Ver club</button></h3>${preHTML(c)}</section>`;
  else if(c){const r=rank('mes');const me=r.find(x=>x.p.id==='me');const top=r.slice(0,3);const list=top.some(x=>x.p.id==='me')?top:[...top,me];const above=r[me.rank-2];
    clubB=`<section class="sect stg" style="--i:1"><h3>${c.name}<button data-act="tab" data-v="club">Ver club</button></h3><div class="rows">${list.map(x=>rowHTML(x)).join('')}</div>${above?`<p class="gap">${ic('flame',14)}<span>Te faltan <b>${above.pts-me.pts+1}</b> para pasar a <b>${above.p.n}</b></span></p>`:`<p class="gap">Vas primero. <b>Defiende tu puesto.</b></p>`}</section>`}
  else clubB=`<section class="sect stg" style="--i:1"><h3>Tabla del día</h3><div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="rows">${GLOBAL.slice(0,3).map((g,i)=>`<div class="row"><span class="pos">${i+1}</span>${av({n:g.n,c:g.c})}<span class="nm">${g.n}</span><span class="pt">${g.v}</span></div>`).join('')}</div><p style="font-size:13px;color:var(--mute)">Juegas contra todos. Con un club juegas contra tus amigos.</p><div class="btns" style="margin:0"><button class="btn" data-act="newclub">Crear club</button><button class="btn ghost" data-act="joinclub">Unirme</button></div></div></section>`;
  const cu=cupInfo();let cupT,cupS;
  if(!c){cupT='';}else if(cu.kind==='none'){cupT='Invita a 1 amigo más para abrir la copa'}else if(d<=3){const me=cu.seeds.findIndex(p=>p.id==='me')+1;cupT=`Clasificación: vas ${me}° de ${cu.n}`;cupS=me<=4?'Estás dentro de los 4 que pasan':'Estás fuera de los 4 que pasan'}else if(d===4){cupT='Mañana arrancan las semifinales';cupS='El cuadro ya está armado'}else{cupT=d===5?'Hoy: semifinal':'Hoy: la final';cupS='Tu partido del día es tu marcador'}
  const cupB=c&&c.started?`<section class="sect stg" style="--i:2"><h3>Copa de la semana<button data-act="cup">Ver cuadro</button></h3><button class="card" data-act="cup" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center"><span style="color:var(--gold)">${ic('trophy',28)}</span><span><b style="display:block">${cupT}</b><small style="color:var(--mute)">${cupS||''}</small></span></button></section>`:'';
  const cont=`<section class="sect stg" style="--i:3"><h3>Seguir jugando</h3><button class="card" data-act="cont" style="width:100%;text-align:left"><div style="display:flex;justify-content:space-between;align-items:center"><span><b>Modo DT · Colo-Colo</b><small style="display:block;color:var(--mute)">Temporada 2 · fecha 14 de 38</small></span><span style="color:var(--acc2)">${ic('chev',20)}</span></div><div style="height:6px;border-radius:3px;background:var(--panel2);margin-top:10px;overflow:hidden"><i style="display:block;height:100%;width:37%;background:var(--acc)"></i></div></button></section>`;
  return hero+clubB+cupB+cont}

function preHTML(c){const mem=people(),own=c.owner==='me',ow=PPL.find(p=>p.id===c.owner);
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="seal" style="background:var(--blue);color:#06141f">PRETEMPORADA</span><small style="color:var(--mute)">Aún no suman puntos</small></div><div class="avs">${mem.map(x=>av(x,34)).join('')}</div><p style="font-size:13px;color:var(--mute)">Los puntos empiezan cuando se inicia la temporada. Así todos alcanzan a entrar.</p><div class="row" style="justify-content:space-between"><span style="color:var(--mute);font-size:12px">Código</span><b class="mono" style="color:var(--gold);font-size:18px">${c.code}</b><button class="nudge" data-act="copycode2">Copiar</button></div>${own?`<button class="btn big" data-act="startseason" ${mem.length<2?'disabled style="opacity:.45"':''}>Iniciar temporada</button><p style="font-size:12px;color:var(--dim);text-align:center">${mem.length<2?'Hacen falta 2 miembros como mínimo.':mem.length+' miembros listos.'}</p><button class="link" data-act="simjoin" style="align-self:center">Simular que se unen amigos</button>`:`<p style="font-size:13px"><b>${ow.n}</b> iniciará la temporada.</p><button class="link" data-act="ownerstart" style="align-self:center">(Demo) Que ${ow.n} la inicie</button>`}</div>`}
function reel(id){
  const f=(x0,y0,x1,y1)=>`<i class="finger rl-f" style="--x0:${x0}px;--y0:${y0}px;--x1:${x1}px;--y1:${y1}px"></i>`;
  const R={
  var:`<div class="rv-field"><i class="rv-p a"></i><i class="rv-p b"></i></div><div class="rv-opts"><span>Penal</span><span>Sigue</span><span>Roja</span></div>${f(280,60,95,118)}`,
  bingo:`<div class="rb-g">${Array.from({length:9},(_,k)=>`<span style="--k:${k}"></span>`).join('')}</div>`,
  versus:`<div class="rw"></div><i class="rw-pt"></i><span class="rv-av" style="left:24px">${av(PPL[0],40)}</span><span class="rv-av" style="right:24px">${av(PPL[2],40)}</span>`,
  draft:`<div class="rd-pitch"></div>${[[110,30],[150,50],[190,30],[150,92]].map((p,k)=>`<i class="rd-ch" style="left:${p[0]}px;top:${p[1]+14}px;--k:${k}"></i>`).join('')}`,
  dtonline:`<div class="rbars">${[70,52,86,40,62].map((h,k)=>`<i style="--h:${h}px;--k:${k}"></i>`).join('')}</div>`,
  dt:`<div class="rd-pitch"></div>${[[100,40,40,20],[150,60,-30,30],[190,40,-40,40],[130,95,50,-30]].map((p,k)=>`<i class="rdot" style="left:${p[0]}px;top:${p[1]}px;--dx:${p[2]}px;--dy:${p[3]}px;--k:${k}"></i>`).join('')}`,
  pres:`<div class="rcard" style="transform:rotate(-4deg)">Decisión 2</div><div class="rcard top">Fichar a la estrella</div>`,
  cotrero:`<div style="width:80%;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;font:700 12px var(--f-n);letter-spacing:.1em;color:var(--mute)"><span>POTRERO</span><span>PRIMERA</span><span>LEYENDA</span></div><div class="rfill"><i></i></div></div>`
  };
  const base=R[id]||(id==='cotmed'?R.cotrero:null);
  if(base)return `<div class="reel">${base}</div>`;
  const g=GAMES.find(x=>x.id===id);
  return `<div class="reel"><div style="text-align:center;color:var(--mute);font-size:13px;padding:0 20px"><span style="color:${g.col}">${ic(g.ic,38)}</span><br>Mira la demo con la mano guiada.</div></div>`}

function vJugar(){
  const rec=GAMES.filter(g=>['quien','mas','versus'].includes(g.id));
  const gc=(g,big)=>`<button class="gc ${big?'big':''}" data-act="game" data-v="${g.id}" style="--gc:${g.col}"><span class="gi">${ic(g.ic,big?30:24)}</span><b>${g.n}</b><small>${g.min>=60?(g.min/60)+' h':g.min+' min'} · ${g.solo?'solo':'con amigos'}</small></button>`;
  const m=mode()==='total'&&scoring();
  const cap=m?`<div class="cap">Partidas libres hoy <b>${state.free}/100</b><i style="width:${state.free}%"></i></div>`:`<div class="cap">${!state.club?'Sin club no hay puntos ni sobres. Crea uno o únete.':!state.club.started?'Pretemporada: aún no suman puntos ni sobres.':'Club Clásico: las partidas libres dan sobres, no puntos.'}</div>`;
  return `<div class="sect stg" style="--i:0;margin-top:6px"><h3>Para ti</h3><div class="hrow">${rec.map(g=>gc(g,true)).join('')}</div></div>
  <div class="stg" style="--i:1">${cap}</div>
  ${SECS.map(([k,l,s],i)=>`<section class="sect stg" style="--i:${i+2}"><h3>${l}<small style="font:500 12px var(--f-b);color:var(--dim)">${s}</small></h3><div class="hrow">${GAMES.filter(g=>g.sec===k).map(g=>gc(g)).join('')}</div></section>`).join('')}`}

function vClub(){
  const c=state.club;
  if(!c){return `<div class="sect stg" style="--i:0;margin-top:6px"><div class="card" style="display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center;padding:22px"><span style="color:var(--acc)">${ic('shield',44)}</span><h2 style="font:800 22px var(--f-d)">Juega con tus amigos</h2><p style="color:var(--mute);font-size:14px">Crea un club o únete con un código.</p><div class="btns" style="width:100%"><button class="btn" data-act="newclub">Crear club</button><button class="btn ghost" data-act="joinclub">Unirme</button></div></div></div><div class="sect stg" style="--i:1"><h3>Tabla general del día</h3><div class="rows">${GLOBAL.map((g,i)=>`<div class="row"><span class="pos">${i+1}</span>${av({n:g.n,c:g.c})}<span class="nm">${g.n}</span><span class="pt">${g.v}</span></div>`).join('')}</div></div>`}
  const m=mult(),tt=mode()==='total';
  const head=`<button class="chead stg" style="--i:0;width:100%;text-align:left" data-act="switch">${crest(c.crest,44,c.name.slice(0,2).toUpperCase())}<span style="flex:1;min-width:0"><h2>${c.name}</h2><small>${people().length} ${people().length===1?'miembro':'miembros'} · </small><span class="seal ${tt?'t':'c'}">${tt?'TOTAL ×2':'CLÁSICO'}</span></span><span style="color:var(--mute)">${ic('chev',20)}</span></button>
  <p class="stg" style="--i:1;margin-top:10px;font-size:12px;color:var(--mute)">${tt?'Suman: partido del día ×2, copa ×2 y partidas libres (tope 100/día).':'Suman: partido del día y copa semanal.'}</p>
  <div class="seg2 stg" style="--i:2;margin-top:12px">${[['tabla','Tabla'],['copa','Copa'],['muro','Muro']].map(([k,l])=>`<button data-act="ctab" data-v="${k}" class="${state.clubTab===k?'on':''}">${l}</button>`).join('')}</div>`;
  if(!c.started)return head.replace(/<p class="stg" style="--i:1;[\s\S]*$/,'')+`<div class="stg" style="--i:2;margin-top:12px">${preHTML(c)}</div><div class="rows" style="margin-top:12px">${people().map(p=>`<div class="row ${p.id==='me'?'me':''}">${av(p)}<span class="nm">${p.id==='me'?'Tú':p.n}</span><span class="pend">Listo</span></div>`).join('')}</div>`;
  let body='';
  if(state.clubTab==='tabla'){
    const v=state.clubView,r=rank(v==='gen'?'gen':v);
    body=`<div class="seg2" style="margin-top:12px;max-width:260px">${[['hoy','Hoy'],['mes','Mes'],['gen','General']].map(([k,l])=>`<button data-act="cview" data-v="${k}" class="${v===k?'on':''}">${l}</button>`).join('')}</div>
    ${people().length<2?`<div class="card" style="margin-top:12px;text-align:center;color:var(--mute);font-size:14px">Eres el único por ahora. Invita a tus amigos con el código <b style="color:var(--fg)">${c.code}</b>.</div>`:''}
    <div class="rows" id="tbl" style="margin-top:12px">${r.map(x=>rowHTML(x,v==='hoy')).join('')}</div>
    <p class="gap">${v==='hoy'?'Solo cuenta el partido del día.':v==='mes'?'Octubre · incluye partido, copa'+(tt?' y partidas libres.':'.'):'Todas las temporadas.'}</p>`}
  else if(state.clubTab==='copa')body=`<div style="margin-top:12px">${cupHTML()}</div>`;
  else body=muroHTML();
  return head+`<div class="stg" style="--i:3">${body}</div>`}

function cupHTML(){
  const cu=cupInfo(),d=state.day,m=mult();
  if(cu.kind==='none')return `<div class="card" style="color:var(--mute);text-align:center">La copa abre cuando hay 2 miembros o más.</div>`;
  const tag=(p)=>p?`${av(p,22)}<span>${p.id==='me'?'Tú':p.n}</span>`:'<span style="color:var(--dim)">Por definir</span>';
  const mt=(x,label)=>{const aw=x.w&&x.w===x.a,bw=x.w&&x.w===x.b;return `<div class="mt ${x.now?'now':''}"><span class="st">${label}${x.now?' · hoy':''}</span><div class="t ${aw?'w':bw?'l':''}">${tag(x.a)}<b>${x.sa??'–'}</b></div><div class="t ${bw?'w':aw?'l':''}">${tag(x.b)}<b>${x.sb??'–'}</b></div></div>`};
  let h=`<div class="eyebrow" style="margin-bottom:8px"><span>Lun a jue · clasificación</span><span>${d<=3?'en curso':'cerrada'}</span></div>`;
  const wk=rank('sem');
  h+=`<div class="rows">${wk.map((x,i)=>(i===4&&cu.kind==='sf'?'<div class="cut"></div>':'')+`<div class="row ${x.p.id==='me'?'me':''} ${cu.kind==='sf'&&i>=4?'dim':''}"><span class="pos">${i+1}</span>${av(x.p,28)}<span class="nm">${x.p.id==='me'?'Tú':x.p.n}</span><span class="pt" style="font-size:18px">${x.pts}</span></div>`).join('')}</div>`;
  h+=`<div class="eyebrow" style="margin:18px 0 8px"><span>Sáb y dom · eliminación</span><span>${d>=5?'en curso':'pendiente'}</span></div>`;
  if(cu.kind==='sf')h+=`<div class="bracket">${mt(cu.sf[0],'Semifinal 1 · sáb')}${mt(cu.sf[1],'Semifinal 2 · sáb')}<div class="fin">${mt(cu.fin,'Final · dom')}</div></div>`;
  else h+=`<div class="bracket"><div class="fin" style="max-width:100%">${mt(cu.fin,'Final · dom')}</div></div>`;
  h+=`<p class="gap">Cada cruce lo gana quien saque más en el partido del día. Si no juegas, pierdes.</p>`;
  if(d===4)h+=`<p class="gap">Hoy, viernes: se confirma el cuadro.</p>`;
  return h}

function muroHTML(){
  const R=['🔥','👏','😂'];
  const items=[['juan','Juan sacó 71 en el partido del día','hace 2 h'],['vale','Vale pasó a Pedro en la tabla del mes','hace 3 h'],['pedro','Pedro jugó el partido del día · 58','hace 5 h']];
  const P=['Juan','Vale','Tú'];
  const v=state.votes;const tot=v?v.reduce((a,b)=>a+b,0):0;
  return `<div class="feed" style="margin-top:12px">${items.map(([id,t,w],i)=>{const p=PPL.find(x=>x.id===id);return `<div class="fi">${av(p,30)}<div style="flex:1"><div>${t}</div><small>${w}</small><div class="rcts">${R.map(r=>{const k=i+r;return `<button class="rct ${state.reacts[k]?'on':''}" data-act="react" data-v="${k}">${r}${state.reacts[k]?' 1':''}</button>`}).join('')}</div></div></div>`}).join('')}</div>
  <div class="card poll" style="margin-top:12px"><div class="eyebrow">Encuesta rápida</div><p style="font:800 17px var(--f-d);margin-top:6px">¿Quién gana la copa del domingo?</p>${P.map((n,i)=>`<button data-act="vote" data-v="${i}"><i style="width:${v?Math.round(v[i]/tot*100):0}%"></i><span>${n}</span><span>${v?Math.round(v[i]/tot*100)+'%':''}</span></button>`).join('')}</div>`}

function drawDeck(){const L=Object.keys(state.cards).length;return L}
function vCartas(){
  const tab=state.cardTab,have=Object.keys(state.cards).length;
  const seg=`<div class="seg2" style="margin-top:6px">${[['sobres','Sobres'],['album','Álbum'],['once','Mi once']].map(([k,l])=>`<button data-act="ctab2" data-v="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>`;
  let b='';
  if(tab==='sobres'){
    b=lockHTML()+`<div class="sect"><h3>Para abrir<small style="font:500 12px var(--f-b);color:var(--dim)">${state.packs.length} ${state.packs.length===1?'sobre':'sobres'}</small></h3>${state.packs.length?`<div class="packs">${state.packs.map((p,i)=>{const q=PACKQ[p.q];return `<button class="pack" data-act="openpack" data-v="${i}" style="--c1:${q[0]};--c2:${q[1]}"><b>${q[2]}</b><small>${p.src}</small></button>`}).join('')}</div>`:`<div class="card" style="text-align:center;color:var(--mute);font-size:14px">No tienes sobres. Juega el partido del día para ganar uno.</div>`}</div>
    <div class="sect"><h3>Cómo ganas sobres</h3><div class="rows">${[['Requisito','Un club con la temporada iniciada'],['Partido del día','Mejor marcador, mejor sobre'],['Podio del mes','Los 3 primeros ganan uno Élite'],['Copa semanal','El campeón gana uno top'],['Racha de 7 días','Uno cada semana seguida'],['Partidas libres',`Hasta 3 por día · te quedan ${state.practiceLeft}`]].map(([a,b])=>`<div class="row"><span style="color:var(--acc2)">${ic('cards',20)}</span><span class="nm">${a}<small style="display:block;color:var(--mute);font-weight:400;font-size:12px">${b}</small></span></div>`).join('')}</div></div>`}
  else if(tab==='album'){
    b=`<div class="eyebrow" style="margin:12px 0 10px"><span>Colección</span><span class="mono">${have}/${POOL.length}</span></div><div class="cgrid">${POOL.map(c=>cardHTML(c,!state.cards[c.id],true)).join('')}</div>`}
  else{
    const best=pos=>POOL.filter(c=>c.pos===pos&&state.cards[c.id]).sort((a,b)=>b.r-a.r);
    const F=[['POR',[[50,90]]],['DEF',[[18,72],[39,76],[61,76],[82,72]]],['MED',[[26,50],[50,56],[74,50]]],['DEL',[[20,26],[50,18],[80,26]]]];
    let slots='',sum=0,cnt=0;
    F.forEach(([pos,pts])=>{const l=best(pos);pts.forEach((p,i)=>{const c=l[i];if(c){sum+=c.r;cnt++}slots+=`<div class="slot ${c?'f':''}" style="left:${p[0]}%;top:${p[1]}%;${c?`--rc:${rar(c.r)[0]}`:''}"><i>${c?c.r:'?'}</i>${c?c.n.split(' ').slice(-1)[0]:pos}</div>`})});
    b=`<div class="eyebrow" style="margin:12px 0 10px"><span>Formación 4-3-3</span><span class="mono">Fuerza ${cnt?Math.round(sum/cnt):'–'}</span></div><div class="pitch"><div class="ln"></div>${slots}</div><p class="gap">${cnt<11?'Abre sobres para completar tu once.':'Once completo.'}</p>`}
  return seg+b}

function cardHTML(c,lock,small){const [col,rn]=rar(c.r);return `<div class="c3 flip ${lock?'lock':''} ${c.r>=90?'glow':''}" style="--rc:${col}"><div class="in"><div class="b"></div><div class="f"><span class="r">${lock?'?':c.r}</span><span class="p">${c.pos}</span><span style="margin:auto;color:#fffc">${ic('user',small?30:34)}</span><span class="nm2">${lock?'???':c.n}</span><span class="cl">${lock?'':c.cl}</span></div></div></div>`}

function vYo(){
  const t=state.trophies,m=mult();
  const TR=[['pack','Primer sobre'],['streak7','Racha de 7'],['perfect','Partido perfecto'],['cup','Campeón de copa'],['month','Campeón del mes'],['podium','Podio del mes']];

const TIME={quien:20000,mas:10000,club:12000,trivia:10000};
function mkItems(kind,n){
  if(kind==='quien')return shuffle(QUIEN).slice(0,n).map(q=>({...q,opts:shuffle(q.opts),ci:null}));
  if(kind==='mas')return shuffle(MAS).slice(0,n).map(q=>{const L=shuffle([q.a,q.b]);return{pair:L,ci:L[0][2]>L[1][2]?0:1}});
  if(kind==='club')return shuffle(CLUBQ).slice(0,n).map(k=>{const o=shuffle([k,...shuffle(CLUBQ.filter(x=>x!==k)).slice(0,3)]);return{k,o,ci:o.indexOf(k)}});
  return shuffle(TRIV).slice(0,n).map(q=>{const o=shuffle(q.opts);return{...q,opts:o,ci:o.indexOf(q.ans)}})}
function renderItem(kind,it,i,n,dots){
  let stem,opts,cls='';
  if(kind==='quien'){it.ci=it.opts.indexOf(it.ans);stem=`<div class="clues" id="clues">${it.clues.map((c,k)=>`<span class="clue ${k<1?'on':''}">${c}</span>`).join('<i class="arr"></i>')}</div><p class="q">¿Quién es?</p>`;opts=it.opts.map((o,k)=>`<button class="opt" data-opt="${k}">${o}</button>`)}
  else if(kind==='mas'){cls='two';stem=`<p class="q">¿Quién vale más?</p>`;opts=it.pair.map((p,k)=>`<button class="opt pl" data-opt="${k}">${av({n:p[0],c:['#6cabdd','#f2b84b'][k]},44)}<b>${p[0]}</b><small>${p[1]}</small><span class="val">?</span></button>`)}
  else if(kind==='club'){const c=CLUBS[it.k];stem=`<div id="bc" class="blurc" style="filter:blur(12px)">${crest(c.c,96,'')}</div><p class="q">¿Qué escudo es?</p>`;opts=it.o.map((o,k)=>`<button class="opt" data-opt="${k}">${CLUBS[o].n}</button>`)}
  else{stem=`<p class="q big">${it.q}</p>`;opts=it.opts.map((o,k)=>`<button class="opt" data-opt="${k}">${o}</button>`)}
  return `<div class="qwrap"><div class="dotsq">${dots.map((d,k)=>`<i class="${k===i?'cur':d||''}"></i>`).join('')}</div><div class="timer"><i id="tbar"></i></div><div class="stem">${stem}</div><div class="opts ${cls}" id="opts">${opts.join('')}</div></div>`}
function waitPick(kind,it,ms){
  const t=TOK;return new Promise((res,rej)=>{const t0=performance.now();let done=false;const bar=$('#tbar'),gb=$('#gb');
    const fin=k=>{if(done)return;done=true;clearInterval(iv);gb.onclick=null;res({k,left:Math.max(0,1-(performance.now()-t0)/ms)})};
    gb.onclick=e=>{const o=e.target.closest('[data-opt]');if(o)fin(+o.dataset.opt)};
    const iv=setInterval(()=>{if(t!==TOK){clearInterval(iv);rej(CANCEL);return}
      const f=Math.max(0,1-(performance.now()-t0)/ms);bar.style.transform=`scaleX(${f})`;if(f<.25)bar.style.background='var(--red)';
      if(kind==='quien'){const n=it.clues.length,show=Math.min(n,1+Math.floor((1-f)*n*1.05));$$('.clue').forEach((c,k)=>c.classList.toggle('on',k<show))}
      if(kind==='club'){const b=$('#bc');if(b)b.style.filter=`blur(${(1+11*f).toFixed(1)}px)`}
      if(f<=0)fin(-1)},60)})}
async function runQuiz(kind,items,{ghost}={}){
  const dots=items.map(()=>''),fr=[];
  for(let i=0;i<items.length;i++){
    const it=items[i],gb=$('#gb');
    gb.innerHTML=renderItem(kind,it,i,items.length,dots);
    if(ghost&&i===0){gb.style.pointerEvents='none';const cap={quien:'Toca al jugador',mas:'Toca al que vale más',club:'Toca el escudo',trivia:'Toca la respuesta'}[kind];await ghostTap($(`[data-opt="${it.ci}"]`),cap);gb.style.pointerEvents='';gb.innerHTML=renderItem(kind,it,i,items.length,dots)}
    const r=await waitPick(kind,it,TIME[kind]);
    const ok=r.k===it.ci;fr.push(ok?0.4+0.6*r.left:0);dots[i]=ok?'ok':'no';
    $$('[data-opt]').forEach(o=>{const k=+o.dataset.opt;if(k===it.ci)o.classList.add('good');else if(k===r.k)o.classList.add('bad')});
    if(kind==='quien')$$('.clue').forEach(c=>c.classList.add('on'));

    if(kind==='mas')$$('.opt .val').forEach((v,k)=>v.textContent=it.pair[k][2]+' M€');
    sfx(ok?'ok':'bad');buzz(ok?20:[40,30,40]);await wait(kind==='mas'?1300:950)}
  return fr}

function drawCards(pk){
  const out=[];const tiers=pk.q==='elite'?[0,.35]:pk.q==='top'?[.15,.45]:pk.q==='bueno'?[.4,.45]:[.7,.25];
  const lo=POOL.filter(c=>c.r<82),mid=POOL.filter(c=>c.r>=82&&c.r<88),hi=POOL.filter(c=>c.r>=88);
  if(pk.q==='bienvenida'&&state.fav)out.push(POOL.find(c=>c.id===FAVCARD[state.fav]));
  if(pk.q==='elite')out.push(rnd(POOL.filter(c=>c.r>=90)));
  while(out.length<5){const r=Math.random();const L=r<tiers[0]?lo:r<tiers[0]+tiers[1]?mid:hi;const c=rnd(L);if(!out.includes(c))out.push(c)}
  return shuffle(out)}

  const g=GAMES.find(x=>x.id===id),tot=mode()==='total'&&scoring();
  const gain=g.sec==='arcade'?(tot?'Suma hasta <b>20 pts</b> la primera vez del día en cada juego (tope 100/día) y da sobres.':'En Clásico no suma puntos, pero da <b>sobres</b>.'):
    g.id==='versus'?(tot?'Ganar suma <b>30 pts</b>.':'En Clásico no suma puntos.'):
    g.id==='draft'?(tot?'Ganar una copa suma <b>30 pts</b>.':'En Clásico no suma puntos.'):
    g.id==='dtonline'?(tot?'Podio semanal: <b>60 / 40 / 20</b>.':'Solo suma en clubes Total.'):
    (tot?'Terminar una temporada suma <b>20 pts</b>.':'En Clásico no suma puntos.');
  sheet(`<div class="sh-h" style="--gc:${g.col}"><span class="gi">${ic(g.ic,28)}</span><div><h3>${g.n}</h3><p>${g.d}</p></div></div>${reel(g.id)}
  ${g.rep.length?`<div class="tags"><span class="t0">Reemplaza a</span>${g.rep.map(r=>`<span>${r}</span>`).join('')}</div>`:''}
  <div class="gain">${gain}</div>
  <div class="btns"><button class="btn ghost" data-act="demo" data-v="${g.id}">Ver demo</button><button class="btn" data-act="play" data-v="${g.id}">Jugar</button></div>`)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||!$('#phone').contains(t))return;
  if(t.dataset.act==='snext'&&e.target.closest('button'))return;
  const f=ACT[t.dataset.act];if(f){if(!['tear','flipc','spin'].includes(t.dataset.act))sfx('tap');f(t,e)}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset?.act==='tear'){e.preventDefault();tear()}});

/* ---------- barra de demostración ---------- */
$('#goto').addEventListener('change',e=>{const v=e.target.value;TOK++;$('#sheetw').innerHTML='';if(v==='portada'){hideFull();state={...fresh(),stage:'portada'};portada();return}if(state.stage!=='app')enterApp(true);else hideFull();go(v)});
$('#evset').addEventListener('change',e=>{const v=e.target.value,[ph,ek]=v.includes('-')?v.split('-'):v==='none'?['none','none']:['now',v];state.evPhase=ph;state.event=ek;if(state.stage==='app')refresh();else if(ph!=='none'){enterApp(true)}toast(ph==='now'?'Evento de hoy: toca JUGAR':ph==='pre'?'Previa del evento de mañana':ph==='after'?'Día después':'Sin evento')});
$('#dayset').addEventListener('change',e=>{state.day=+e.target.value;if(state.stage==='app')refresh()});
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>{$$('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));if(state.club)state.club.mode=b.dataset.mode;if(state.stage==='app')refresh();toast(b.dataset.mode==='total'?'Modo Total: todo suma, ×2':'Modo Clásico: partido y copa')}));
$$('[data-demo]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.demo;TOK++;$('#sheetw').innerHTML='';
  if(k==='reset'){state=fresh();JSON.parse(PPL0).forEach((q,i)=>Object.assign(PPL[i],q));$('#evset').value='none';FANT=null;$$('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode==='total'));$('#dayset').value='2';document.documentElement.classList.remove('rm');portada();return}
  if(state.stage!=='app'){enterApp(true)}else hideFull();
  if(k==='push')pushBanner('Juan te pasó en la tabla','Estás a 37 puntos. Juega el partido del día.');
  if(k==='week')weekStory();
  if(k==='month')monthStory(true);
  if(k==='month0')monthStory(false);
  if(k==='invite'){state={...state,stage:'portada'};inviteScreen()}
}));

portada();renderTabs();renderTop();
})();
</script>
